<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta name="theme-color" content="#0a2a6b">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<title>English Practice · Listening & Speaking</title>
<style> 
:root{
  --bg:#eef3fb;--card:#fff;--fg:#0f1f3a;--mut:#5a6b86;--line:#d6e1f1;
  --acc:#1456c8;--acc-d:#0b3b91;--accfg:#fff;--acc2:#e7f0fe;--acc3:#cfe0fc;
  --ok:#15803d;--okbg:#e6f6ec;--bad:#c62828;--badbg:#fdecec;--warn:#eaf2ff;--warnb:#b9d0f5;
  --gold:#f5b800;--gold-d:#9a6b00;--goldbg:#fff4cc;
  --pink:#dbe8fd;--green:#bcd4fb;--blue:#9cc0f8;--shadow:0 1px 2px rgba(15,40,90,.06),0 6px 18px rgba(15,40,90,.07);
  --hero:linear-gradient(135deg,#0a2a6b 0%,#1456c8 55%,#2f80ed 100%);
  --hero-t:linear-gradient(135deg,#050f2b 0%,#0a2a6b 55%,#134a9f 100%);
  --radius:18px;--bn-h:72px;
}
:root[data-theme=dark]{
  --bg:#0b1426;--card:#121e36;--fg:#e8eefb;--mut:#9db0d0;--line:#243556;
  --acc:#5aa2ff;--acc-d:#3b82f6;--accfg:#06142b;--acc2:#162a4d;--acc3:#1d3a6b;
  --ok:#4ade80;--okbg:#0f2a1d;--bad:#ff8a8a;--badbg:#341a1f;--warn:#13264a;--warnb:#27457c;
  --gold:#ffcb2e;--gold-d:#ffd866;--goldbg:#3a3010;
  --pink:#1c3566;--green:#24457f;--blue:#2d5599;--shadow:none;
  --hero:linear-gradient(135deg,#0a1f4d 0%,#123c91 55%,#1d5fd1 100%);
  --hero-t:linear-gradient(135deg,#030914 0%,#081c4a 55%,#0f3a85 100%);
}
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
[hidden]{display:none!important}
html,body{margin:0}
body{font-family:"Segoe UI Variable","Segoe UI",system-ui,-apple-system,Roboto,sans-serif;background:var(--bg);color:var(--fg);line-height:1.5;-webkit-font-smoothing:antialiased;overscroll-behavior-y:none}
button,input,select,textarea{font:inherit;color:inherit}
button{cursor:pointer;touch-action:manipulation}
:focus-visible{outline:3px solid #7db2ff;outline-offset:2px}
@media(prefers-reduced-motion:reduce){*{animation-duration:.01ms!important;animation-iteration-count:1!important;transition-duration:.01ms!important}}

/* ---------- SPANISH HELP TEXT (can be switched off in Settings) ---------- */
.es{display:block;font-size:.76em;font-weight:500;color:var(--mut);line-height:1.3;margin-top:1px;letter-spacing:0;text-transform:none}
.es.i{display:inline;margin:0}
body.noes .es{display:none!important}
header .es,.hero .es,.btn.pri .es,.btn.big .es,.micbtn .es,.card.feat .es,.card.gold .es,#toast .es,.stat .es,.banner .es,.ibtn .es,.tag .es{color:inherit;opacity:.82}
.card.gold .es{opacity:.75}
h2 .es{font-size:15px;font-weight:500;margin-top:2px}
h3 .es{font-size:13px;font-weight:500}
.hero h1 .es{font-size:16px;font-weight:500;margin-top:4px}
.qprompt .es{font-size:14px;font-weight:500;margin-top:3px}
.qprompt .big .es{font-size:15px}
.btn .es{font-size:11px;line-height:1.1;margin-top:1px}
.btn.sm .es.i{font-size:11px}
.opt .es{font-size:12px;font-weight:600}
.card b .es{font-size:12.5px;font-weight:500}
.kpi .es,.hs .es{font-size:10.5px}
.fb .es{font-size:13px}
.target+.es,.heard.es{font-size:15px}

/* ---------- HEADER ---------- */
header.top{background:var(--hero);color:#fff;position:sticky;top:0;z-index:30;box-shadow:0 4px 18px rgba(10,42,107,.28);padding-top:env(safe-area-inset-top)}
header.top.teacher{background:var(--hero-t)}
header.top.teacher::after{content:"";display:block;height:3px;background:linear-gradient(90deg,var(--gold),#ffe07a,var(--gold))}
.topin{max-width:1120px;margin:0 auto;padding:10px 14px 6px;display:flex;align-items:center;gap:8px}
.logo{display:flex;align-items:center;gap:9px;font-weight:800;font-size:19px;letter-spacing:.2px;color:#fff;white-space:nowrap}
.logo .lg{width:34px;height:34px;border-radius:10px;background:#fff;color:var(--acc-d);display:grid;place-items:center;font-size:14px;font-weight:900;letter-spacing:-.5px;box-shadow:0 2px 8px rgba(0,0,0,.18)}
.logo em{font-style:normal;font-weight:500;opacity:.85}
.sp{flex:1}
.stat{background:rgba(255,255,255,.14);border:1px solid rgba(255,255,255,.22);color:#fff;border-radius:999px;padding:5px 12px;font-size:13px;font-weight:700;white-space:nowrap}
.stat.fire{background:linear-gradient(135deg,#ff9f1a,#ff5e3a);border-color:transparent}
.ibtn{background:rgba(255,255,255,.14);border:1px solid rgba(255,255,255,.26);color:#fff;border-radius:999px;min-width:40px;height:38px;padding:0 12px;font-size:16px;display:inline-flex;align-items:center;justify-content:center;gap:6px;font-weight:700}
.ibtn:hover{background:rgba(255,255,255,.26)}
.ibtn.on{background:#fff;color:#0b3b91}
.ibtn .lbl{font-size:12px}
.userchip{display:flex;align-items:center;gap:8px;background:rgba(255,255,255,.14);border:1px solid rgba(255,255,255,.3);color:#fff;border-radius:999px;padding:3px 12px 3px 4px;font-weight:700;font-size:13px;line-height:1.1;text-align:left}
.userchip:hover{background:rgba(255,255,255,.26)}
.userchip small{display:block;font-size:10px;font-weight:700;opacity:.9;color:#fff}
.userchip.t small{color:var(--gold)}
nav.tabs{max-width:1120px;margin:0 auto;display:flex;gap:4px;overflow-x:auto;padding:0 14px;scrollbar-width:none}
nav.tabs::-webkit-scrollbar{display:none}
nav.tabs button{white-space:nowrap;border:0;background:transparent;color:rgba(255,255,255,.88);border-radius:12px 12px 0 0;padding:8px 16px 7px;font-weight:700;font-size:14px;border-bottom:3px solid transparent;transition:background .12s;text-align:center;line-height:1.15}
nav.tabs button .es{font-size:10.5px;color:inherit;opacity:.75}
nav.tabs button:hover{background:rgba(255,255,255,.12);color:#fff}
nav.tabs button[aria-current=page]{background:var(--bg);color:var(--acc-d)}
:root[data-theme=dark] nav.tabs button[aria-current=page]{color:var(--acc)}
main{max-width:1120px;margin:0 auto;padding:20px 14px 40px}
h2{margin:0 0 4px;font-size:27px;letter-spacing:-.3px;color:var(--acc-d)}
:root[data-theme=dark] h2{color:#fff}
h3{margin:24px 0 12px;font-size:17px;letter-spacing:.1px;display:flex;align-items:center;gap:8px;color:var(--fg)}
h3::after{content:"";flex:1;height:1px;background:var(--line)}
.muted{color:var(--mut)}
small{color:var(--mut)}
.panel{background:var(--card);border:1px solid var(--line);border-radius:var(--radius);padding:16px;box-shadow:var(--shadow);margin:12px 0}
.view-in{animation:viewin .28s ease-out both}
@keyframes viewin{from{opacity:0;transform:translateY(10px)}to{opacity:1;transform:none}}

/* ---------- BOTTOM NAV (phones) ---------- */
nav.bnav{position:fixed;left:0;right:0;bottom:0;z-index:30;background:var(--card);border-top:1px solid var(--line);display:none;padding:5px 6px calc(5px + env(safe-area-inset-bottom));box-shadow:0 -6px 22px rgba(10,42,107,.14)}
nav.bnav .bi{flex:1;border:0;background:transparent;display:flex;flex-direction:column;align-items:center;gap:0;padding:5px 2px;border-radius:14px;color:var(--mut);font-size:11px;font-weight:700;line-height:1.15;transition:color .15s,background .15s}
nav.bnav .bi .e{font-size:21px;line-height:1.2;transition:transform .15s}
nav.bnav .bi .es{font-size:9.5px;font-weight:600;margin:0;color:inherit;opacity:.8}
nav.bnav .bi[aria-current=page]{color:var(--acc);background:var(--acc2)}
nav.bnav .bi[aria-current=page] .e{transform:translateY(-2px) scale(1.12)}
body.inquiz nav.bnav{display:none!important}
@media(max-width:720px){
  nav.bnav{display:flex}
  nav.tabs{display:none!important}
  main{padding:14px 12px calc(var(--bn-h) + 28px + env(safe-area-inset-bottom))}
  body.inquiz main{padding-bottom:24px}
  .logo>span:last-child{display:none}
  .topin{gap:6px;padding:8px 10px}
  .stat{padding:4px 9px;font-size:12.5px}
  .ibtn{min-width:36px;height:36px;padding:0 8px;font-size:15px}
  .ibtn .lbl,.userchip .nm,.stat.lv{display:none}
  .userchip{padding:3px 4px}
  h2{font-size:23px}
}

/* ---------- HERO ---------- */
.hero{background:var(--hero);color:#fff;border-radius:24px;padding:24px;display:grid;grid-template-columns:1.4fr 1fr;gap:20px;align-items:center;box-shadow:0 14px 34px rgba(20,86,200,.28);position:relative;overflow:hidden}
.hero.teacher{background:var(--hero-t);box-shadow:0 14px 34px rgba(5,15,43,.4);border:1px solid rgba(245,184,0,.45)}
.hero::before{content:"";position:absolute;right:-70px;top:-70px;width:260px;height:260px;border-radius:50%;background:rgba(255,255,255,.08)}
.hero::after{content:"";position:absolute;right:90px;bottom:-110px;width:220px;height:220px;border-radius:50%;background:rgba(255,255,255,.06)}
.hero>*{position:relative;z-index:1}
.hero h1{margin:6px 0 8px;font-size:30px;line-height:1.15;letter-spacing:-.5px}
.hero p{margin:0 0 16px;opacity:.92;max-width:540px}
.hero .cta{display:flex;flex-wrap:wrap;gap:10px}
.hero .btn.w{background:#fff;color:var(--acc-d);border-color:#fff}
.hero .btn.w .es{color:inherit}
.hero.teacher .btn.w{background:var(--gold);color:#241a00;border-color:var(--gold)}
.hero .btn.o{background:transparent;color:#fff;border-color:rgba(255,255,255,.55)}
.hero .btn.o:hover{background:rgba(255,255,255,.14);border-color:#fff}
.hstats{display:grid;grid-template-columns:repeat(3,1fr);gap:10px}
.hs{background:rgba(255,255,255,.13);border:1px solid rgba(255,255,255,.22);border-radius:14px;padding:10px 6px;text-align:center}
.hs b{display:block;font-size:24px;line-height:1.1}
.hs span{font-size:12px;opacity:.9}
.ringbox{display:flex;align-items:center;gap:14px}
.ring{position:relative;width:104px;height:104px;flex:none}
.ring svg{width:100%;height:100%;transform:rotate(-90deg)}
.ring .rt{stroke:rgba(255,255,255,.2)}
.ring .rp{stroke:#fff;stroke-linecap:round;transition:stroke-dashoffset .9s cubic-bezier(.2,.8,.2,1)}
.ring.done .rp{stroke:var(--gold)}
.ring .rc{position:absolute;inset:0;display:grid;place-items:center;text-align:center;line-height:1.1}
.ring .rc b{font-size:22px;display:block}
.ring .rc small{font-size:10.5px;color:#fff;opacity:.9}
.minibar .lbl{display:flex;justify-content:space-between;font-size:12px;opacity:.9;margin-bottom:4px}
.minibar .t{height:8px;background:rgba(255,255,255,.2);border-radius:99px;overflow:hidden}
.minibar .t div{height:100%;background:#fff;border-radius:99px;transition:width .8s}
.heroright{display:grid;gap:12px}
@media(max-width:760px){.hero{grid-template-columns:1fr;padding:20px;border-radius:22px}.hero h1{font-size:25px}}

/* ---------- ROLES ---------- */
.avw{position:relative;display:inline-block;flex:none}
.av{display:inline-grid;place-items:center;border-radius:50%;color:#fff;font-weight:800;box-shadow:0 0 0 2px rgba(255,255,255,.6)}
.avw.t .av{box-shadow:0 0 0 3px var(--gold)}
.avb{position:absolute;right:-4px;bottom:-4px;width:46%;height:46%;min-width:16px;min-height:16px;border-radius:50%;display:grid;place-items:center;font-size:62%;background:var(--gold);box-shadow:0 1px 4px rgba(0,0,0,.35)}
.avw.s .avb{background:var(--acc)}
.rolepill{display:inline-flex;align-items:center;gap:4px;font-size:12px;font-weight:800;border-radius:99px;padding:3px 11px;letter-spacing:.2px}
.rolepill .es{color:inherit;opacity:.8;font-weight:600;font-size:11px}
.rolepill.t{background:var(--gold);color:#241a00}
.rolepill.s{background:var(--acc2);color:var(--acc-d)}
:root[data-theme=dark] .rolepill.s{color:var(--acc)}
.rsec{margin-top:22px}
.rsec h3{margin:0 0 10px}
.rsec .cnt{font-size:12px;font-weight:700;background:var(--acc2);color:var(--acc-d);border-radius:99px;padding:1px 9px}
.rsec.t h3{color:var(--gold-d)}
.rsec.t .cnt{background:var(--goldbg);color:var(--gold-d)}
.login{max-width:900px;margin:4px auto}
.login h2{text-align:center;font-size:30px}
.login .sub{text-align:center;margin:0 0 4px}
.login .sub .es{display:block}
.pgrid{display:grid;grid-template-columns:repeat(auto-fit,minmax(200px,1fr));gap:14px}
.pcard{background:var(--card);border:1px solid var(--line);border-radius:22px;padding:20px 14px;text-align:center;box-shadow:var(--shadow);display:flex;flex-direction:column;align-items:center;gap:6px;transition:transform .15s,border-color .15s,box-shadow .15s;position:relative;overflow:hidden;animation:viewin .4s ease-out both}
.pcard:hover{transform:translateY(-4px);border-color:var(--acc);box-shadow:0 12px 28px rgba(20,86,200,.2)}
.pcard.t{background:linear-gradient(180deg,var(--goldbg),var(--card) 60%);border-color:var(--gold)}
.pcard.t:hover{border-color:var(--gold);box-shadow:0 12px 28px rgba(245,184,0,.3)}
.pcard .avw .av{box-shadow:0 0 0 4px var(--acc2)}
.pcard.t .avw .av{box-shadow:0 0 0 4px var(--gold)}
.pcard b{font-size:19px}
.pcard small{display:block}
.pcard .lvbar{width:80%;height:6px;background:var(--acc2);border-radius:99px;overflow:hidden;margin-top:2px}
.pcard .lvbar div{height:100%;background:linear-gradient(90deg,#2f80ed,#0a2a6b)}
@media(max-width:720px){.pgrid{grid-template-columns:1fr 1fr;gap:10px}.pcard{padding:16px 8px}.pcard b{font-size:16px}.login h2{font-size:25px}}

/* ---------- CARDS ---------- */
.grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(230px,1fr));gap:14px}
@media(max-width:720px){.grid{grid-template-columns:1fr 1fr;gap:10px}}
@media(max-width:400px){.grid{grid-template-columns:1fr}}
.card{background:var(--card);border:1px solid var(--line);border-radius:var(--radius);padding:15px;text-align:left;box-shadow:var(--shadow);display:flex;flex-direction:column;gap:4px;transition:transform .12s,box-shadow .12s,border-color .12s;position:relative;overflow:hidden}
.card::before{content:"";position:absolute;left:0;top:0;bottom:0;width:4px;background:linear-gradient(180deg,#2f80ed,#0a2a6b);opacity:0;transition:opacity .12s}
.card:hover{transform:translateY(-3px);border-color:var(--acc);box-shadow:0 10px 26px rgba(20,86,200,.18)}
.card:hover::before{opacity:1}
.card:active{transform:scale(.98)}
.card .ic{width:44px;height:44px;border-radius:13px;background:var(--acc2);display:grid;place-items:center;font-size:23px;margin-bottom:4px}
.card b{font-size:15.5px;color:var(--fg);line-height:1.25}
.card span.d{color:var(--mut);font-size:13px}
.card .go{margin-top:auto;color:var(--acc);font-weight:700;font-size:13px;padding-top:6px}
.card.feat{background:var(--hero);color:#fff;border:0}
.card.feat b,.card.feat span.d,.card.feat .go{color:#fff}
.card.feat .ic{background:rgba(255,255,255,.18)}
.card.gold{background:linear-gradient(135deg,#ffd45c,#f5b800);border:0}
.card.gold b,.card.gold span.d,.card.gold .go{color:#241a00}
.card.gold .ic{background:rgba(255,255,255,.4)}

/* ---------- BUTTONS & FIELDS ---------- */
.btn{border:1px solid var(--line);background:var(--card);border-radius:12px;padding:9px 15px;font-weight:700;transition:background .12s,border-color .12s,transform .06s;color:var(--fg);min-height:40px;line-height:1.2}
.btn:hover{border-color:var(--acc);background:var(--acc2)}
.btn:active{transform:scale(.97)}
.btn.pri,.btn.big{background:linear-gradient(180deg,#2a72e0,#1456c8);color:#fff;border-color:#1456c8;box-shadow:0 2px 8px rgba(20,86,200,.3)}
.btn.pri:hover,.btn.big:hover{background:linear-gradient(180deg,#3b82f0,#1a63df);border-color:#1a63df}
.btn.sm{padding:5px 11px;font-size:13px;border-radius:9px;min-height:32px}
.btn.ghost{background:transparent}
.btn.danger{color:var(--bad);border-color:var(--bad)}
.btn[disabled]{opacity:.55;cursor:default}
.chip{display:inline-flex;align-items:center;gap:5px;background:var(--acc2);color:var(--acc-d);border-radius:999px;padding:4px 12px;font-size:13px;font-weight:700}
:root[data-theme=dark] .chip{color:var(--acc)}
.chips{display:flex;flex-wrap:wrap;gap:6px;margin:8px 0}
.chips button{border:1px solid var(--line);background:var(--card);border-radius:999px;padding:7px 14px;font-weight:600;font-size:13px}
.chips button:hover{border-color:var(--acc)}
.chips button.on{background:var(--acc);color:var(--accfg);border-color:var(--acc)}
select,input[type=text],input[type=number],input[type=password],textarea{background:var(--card);border:1px solid var(--line);border-radius:10px;padding:9px 12px;color:var(--fg);font-size:16px}
input[type=text]:focus,input[type=number]:focus,input[type=password]:focus,textarea:focus,select:focus{border-color:var(--acc);box-shadow:0 0 0 3px rgba(20,86,200,.18);outline:none}

/* ---------- ALPHABET ---------- */
.abcrow{display:flex;flex-wrap:wrap;gap:8px;margin:9px 0}
.tile{width:calc((100% - 8*8px)/9);min-width:56px;height:76px;border:0;border-radius:13px;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:2px;color:var(--fg);box-shadow:inset 0 -3px 0 rgba(10,42,107,.12);transition:transform .1s}
@media(max-width:720px){.tile{width:calc((100% - 4*8px)/5);height:70px}}
.tile b{font-size:26px;font-family:Arial,sans-serif;font-weight:600;color:var(--acc-d)}
:root[data-theme=dark] .tile b{color:#fff}
.tile i{font-size:12px;font-weight:700;color:var(--mut)}
.tile.pink{background:var(--pink)}.tile.green{background:var(--green)}.tile.blue{background:var(--blue)}
.tile:active,.tile:hover{transform:translateY(-3px) scale(1.04)}
.spellout{display:flex;flex-wrap:wrap;gap:6px;margin-top:10px}
.spellout div{background:var(--acc2);border-radius:9px;padding:6px 10px;text-align:center;min-width:46px}
.spellout b{display:block;font-size:20px;color:var(--acc-d)}
:root[data-theme=dark] .spellout b{color:#fff}
.spellout i{font-size:12px;color:var(--mut)}

/* ---------- TABLES & LISTS ---------- */
table{border-collapse:separate;border-spacing:0;width:100%;font-size:15px;border:1px solid var(--line);border-radius:12px;overflow:hidden}
th,td{border-bottom:1px solid var(--line);padding:10px 12px;text-align:left}
tr:last-child td,tr:last-child th{border-bottom:0}
th{background:var(--acc2);color:var(--acc-d);font-size:14px}
:root[data-theme=dark] th{color:#fff}
.tblwrap{overflow-x:auto;border-radius:12px;-webkit-overflow-scrolling:touch}
.say{cursor:pointer;border-bottom:1px dashed var(--acc);color:var(--acc);font-weight:600}
.say:hover{background:var(--acc2)}
.natn{font-weight:700;font-size:17px}
.natn u{text-decoration:none;color:#fff;background:var(--acc);border-radius:5px;padding:0 4px;margin-left:1px}
.tilegrid{display:grid;grid-template-columns:repeat(auto-fill,minmax(112px,1fr));gap:10px}
.vt{border:1px solid var(--line);background:var(--card);border-radius:14px;padding:12px 6px;display:flex;flex-direction:column;align-items:center;gap:2px;min-height:96px;box-shadow:var(--shadow);transition:transform .1s,border-color .1s}
.vt:hover{border-color:var(--acc);background:var(--acc2);transform:translateY(-2px)}
.vt .em{font-size:32px}
.vt b{font-size:15px}.vt .es{font-size:12px}
.sw{width:34px;height:34px;border-radius:50%;border:2px solid var(--line);display:inline-block}
.numgrid{display:flex;flex-wrap:wrap;gap:7px}
.numgrid button{min-width:48px;min-height:44px;border:1px solid var(--line);background:var(--card);border-radius:10px;padding:7px 9px;font-weight:700}
.numgrid button:hover,.numgrid button:active{background:var(--acc);color:var(--accfg);border-color:var(--acc)}
.two{display:grid;grid-template-columns:1fr 1fr;gap:14px}
@media(max-width:700px){.two{grid-template-columns:1fr}}
.wordchip{display:inline-block;margin:3px;padding:8px 13px;border-radius:999px;border:1px solid var(--line);background:var(--card);font-weight:600}
.wordchip:hover{background:var(--acc2);border-color:var(--acc)}
.wordchip.long{border-color:var(--acc);background:var(--acc2)}

/* ---------- FLAGS ---------- */
.fl{display:inline-flex;align-items:center;justify-content:center;flex:none;vertical-align:middle}
.flagimg{display:block;max-width:100%;max-height:100%;width:auto;height:auto;border-radius:5px;box-shadow:0 0 0 1px rgba(15,31,58,.22),0 2px 6px rgba(15,31,58,.18);background:#fff;user-select:none;-webkit-user-drag:none}
:root[data-theme=dark] .flagimg{box-shadow:0 0 0 1px rgba(255,255,255,.28),0 2px 8px rgba(0,0,0,.4)}
.flgbig{display:flex;margin:12px 0 4px}
.flgbig.c{justify-content:center}
.natrow{display:grid;grid-template-columns:auto 1.4fr 1.2fr auto;gap:8px 12px;align-items:center;padding:9px 6px;border-bottom:1px solid var(--line)}
.natrow:hover{background:var(--acc2);border-radius:10px}
@media(max-width:700px){
  .natrow{grid-template-columns:auto 1fr auto}
  .natrow>.fl{grid-row:1/3}
  .natrow>.cn{grid-column:2;grid-row:1}
  .natrow>.natn{grid-column:2;grid-row:2}
  .natrow>button{grid-column:3;grid-row:1/3}
}
.flaggrid{display:grid;grid-template-columns:repeat(auto-fill,minmax(150px,1fr));gap:12px;margin-top:8px}
@media(max-width:480px){.flaggrid{grid-template-columns:1fr 1fr;gap:10px}}
.ftile{background:var(--card);border:1px solid var(--line);border-radius:18px;padding:14px 8px 12px;display:flex;flex-direction:column;align-items:center;gap:3px;text-align:center;box-shadow:var(--shadow);transition:transform .12s,border-color .12s,box-shadow .12s;animation:viewin .3s ease-out both}
.ftile:hover{transform:translateY(-3px);border-color:var(--acc);box-shadow:0 10px 24px rgba(20,86,200,.18)}
.ftile:active{transform:scale(.97)}
.ftile .fl{margin-bottom:6px}
.ftile b{font-size:14.5px;line-height:1.2}
.ftile .natn{font-size:15px;color:var(--acc-d)}
:root[data-theme=dark] .ftile .natn{color:var(--acc)}
.ftile .es{font-size:11.5px;margin:0}
.flash .fl{margin:0 auto 6px}

/* ---------- QUIZZES ---------- */
.qcard{background:var(--card);border:1px solid var(--line);border-radius:22px;padding:20px;box-shadow:var(--shadow);max-width:840px;margin:0 auto;animation:viewin .25s ease-out both}
@media(max-width:720px){.qcard{padding:16px;border-radius:20px}}
.qhead{display:flex;gap:10px;align-items:center;flex-wrap:wrap}
.qnum{font-weight:700;color:var(--mut)}.qscore{font-weight:800;color:var(--ok)}
.bar{height:10px;background:var(--acc2);border-radius:99px;margin:14px 0;overflow:hidden}
.bar div{height:100%;background:linear-gradient(90deg,#2f80ed,#0a2a6b);border-radius:99px;transition:width .3s}
.tbar{height:8px;background:var(--acc2);border-radius:99px;overflow:hidden;margin:-4px 0 10px}
.tbar div{height:100%;width:100%;background:linear-gradient(90deg,var(--gold),#ff9f1a);border-radius:99px}
.tbar.low div{background:linear-gradient(90deg,#ff7a7a,var(--bad))}
.timer{font-weight:800;color:var(--gold-d)}
.qprompt{font-size:19px;margin:12px 0;font-weight:600}
.qprompt .big{display:block;font-size:28px;margin-top:8px;color:var(--acc-d);line-height:1.25}
:root[data-theme=dark] .qprompt .big{color:#fff}
.arow{display:flex;gap:8px;flex-wrap:wrap;margin:8px 0 14px}
.opts{display:grid;grid-template-columns:repeat(auto-fit,minmax(170px,1fr));gap:11px}
@media(max-width:720px){.opts{grid-template-columns:1fr 1fr}.opts.col1{grid-template-columns:1fr}}
.opt{border:2px solid var(--line);background:var(--card);border-radius:16px;padding:14px 10px;font-weight:700;font-size:17px;text-align:center;display:flex;align-items:center;justify-content:center;gap:10px;min-height:60px;transition:border-color .1s,background .1s,transform .06s}
.opt:hover:not([disabled]){border-color:var(--acc);background:var(--acc2)}
.opt:active:not([disabled]){transform:scale(.96)}
.opt.ok{border-color:var(--ok);background:var(--okbg);animation:bump .35s}
.opt.bad{border-color:var(--bad);background:var(--badbg);animation:shake .35s}
@keyframes bump{50%{transform:scale(1.05)}}
@keyframes shake{20%{transform:translateX(-6px)}50%{transform:translateX(6px)}80%{transform:translateX(-3px)}}
.opt[disabled]{cursor:default}
.opt .sw{width:30px;height:30px}
.opt.fo{flex-direction:column;gap:6px;padding:12px 8px}
.opt .lb{font-size:15px;line-height:1.2;display:block}
.opemoji{font-size:44px;line-height:1.1}
.opts.flagsonly{grid-template-columns:1fr 1fr}
.opts.flagsonly .opt,.opts.emojionly .opt{min-height:96px}
.typerow{display:flex;gap:8px;flex-wrap:wrap;align-items:center}
.typerow input{flex:1;min-width:180px;font-size:19px;padding:12px 14px}
.hint{font-size:13px;color:var(--mut);margin-top:6px}
.fb{margin-top:16px;border-radius:14px;padding:0}
.fb.ok,.fb.bad{padding:13px 16px;animation:viewin .2s}
.fb.ok{background:var(--okbg);border:1px solid var(--ok)}
.fb.bad{background:var(--badbg);border:1px solid var(--bad)}
.nextrow{margin-top:14px;display:flex;justify-content:flex-end;position:sticky;bottom:calc(10px + env(safe-area-inset-bottom))}
.nextrow .btn{box-shadow:0 6px 18px rgba(20,86,200,.35);min-height:46px;padding:10px 22px}
.bank,.ans{display:flex;flex-wrap:wrap;gap:8px;min-height:54px;padding:9px;border-radius:14px;margin:9px 0}
.ans{border:2px dashed var(--acc3);background:var(--acc2)}
.bank button,.ans button{border:1px solid var(--acc);background:var(--card);border-radius:11px;padding:9px 14px;font-weight:700;font-size:17px;color:var(--acc-d);box-shadow:0 2px 0 var(--acc3);min-height:44px}
:root[data-theme=dark] .bank button,:root[data-theme=dark] .ans button{color:#fff}
.target{font-size:30px;font-weight:800;text-align:center;margin:12px 0;line-height:1.25;color:var(--acc-d);word-break:break-word}
:root[data-theme=dark] .target{color:#fff}
.target .w-ok{color:var(--ok)}.target .w-bad{color:var(--bad);text-decoration:underline wavy}
.heard{text-align:center;color:var(--mut);margin:4px 0;min-height:22px}
.micbtn{background:linear-gradient(180deg,#1f6be0,#0b3b91);color:#fff;border-color:#0b3b91;font-size:18px;padding:12px 24px;border-radius:999px;box-shadow:0 4px 14px rgba(11,59,145,.4);min-height:52px}
.micbtn:hover{background:linear-gradient(180deg,#2f80ed,#0f48ad);border-color:#0f48ad}
.micbtn.live{animation:pulse 1s infinite}
@keyframes pulse{0%{box-shadow:0 0 0 0 rgba(47,128,237,.6)}100%{box-shadow:0 0 0 18px rgba(47,128,237,0)}}
.center{display:flex;justify-content:center;gap:10px;flex-wrap:wrap;margin:12px 0;align-items:center}
.notice{background:var(--warn);border:1px solid var(--warnb);border-left:4px solid var(--acc);border-radius:10px;padding:11px 14px;font-size:14px;margin:12px 0}
.notice.gold{background:var(--goldbg);border-color:var(--gold);border-left-color:var(--gold)}
.result{text-align:center}
.result .score{font-size:64px;font-weight:800;background:linear-gradient(135deg,#2f80ed,#0a2a6b);-webkit-background-clip:text;background-clip:text;color:transparent;line-height:1.1;margin:6px 0}
:root[data-theme=dark] .result .score{background:linear-gradient(135deg,#8cc0ff,#fff);-webkit-background-clip:text;background-clip:text}
.wronglist{text-align:left;margin-top:14px}
.wronglist>div{border-bottom:1px solid var(--line);padding:8px 0}
.pbar{display:grid;grid-template-columns:130px 1fr 96px;gap:10px;align-items:center;margin:10px 0;font-size:14px}
@media(max-width:480px){.pbar{grid-template-columns:96px 1fr 70px;font-size:12.5px}}
.pbar .t{height:12px;background:var(--acc2);border-radius:99px;overflow:hidden}
.pbar .t div{height:100%;background:linear-gradient(90deg,#2f80ed,#0a2a6b);border-radius:99px}
.flash{border:2px solid var(--acc);border-radius:20px;padding:26px 14px;text-align:center;background:linear-gradient(180deg,var(--acc2),var(--card));min-height:150px;display:flex;flex-direction:column;justify-content:center;gap:6px}
.flash .f1{font-size:30px;font-weight:800;color:var(--acc-d)}
:root[data-theme=dark] .flash .f1{color:#fff}
details{margin:8px 0}
summary{cursor:pointer;font-weight:700;color:var(--acc)}
textarea{width:100%;min-height:76px;font-size:18px}

/* ---------- BADGES ---------- */
.badges{display:grid;grid-template-columns:repeat(auto-fill,minmax(96px,1fr));gap:10px}
.bdg{background:var(--card);border:1px solid var(--line);border-radius:16px;padding:12px 6px;text-align:center;font-size:12px;font-weight:700;display:flex;flex-direction:column;align-items:center;gap:3px;box-shadow:var(--shadow);font:inherit;color:inherit}
.bdg .e{font-size:30px;line-height:1.1}
.bdg.lock{filter:grayscale(1);opacity:.45}
.bdg.new{animation:bump .6s;border-color:var(--gold)}
.bdg small{font-size:10.5px;font-weight:600;line-height:1.2}
.bdg .es{font-size:10.5px}

/* ---------- PODIUM / RANKING ---------- */
.podium{display:flex;align-items:flex-end;justify-content:center;gap:10px;margin:14px 0 6px;padding:0 4px}
.pod{flex:1;max-width:160px;text-align:center;min-width:0}
.pod .nm{font-weight:800;font-size:14px;margin:6px 0 0;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.pod .px{font-size:12px;color:var(--mut);margin-bottom:6px}
.pod .blk{border-radius:16px 16px 0 0;background:linear-gradient(180deg,#3b8cff,#0a2a6b);color:#fff;display:flex;flex-direction:column;align-items:center;padding-top:8px;font-weight:800;animation:rise .9s cubic-bezier(.2,.8,.2,1) both;height:var(--h);font-size:28px}
.pod.p1 .blk{background:linear-gradient(180deg,#ffd45c,#f5b800);color:#241a00}
.pod.p1 .av{box-shadow:0 0 0 3px var(--gold)}
@keyframes rise{from{height:0;opacity:.2}}
.crown{font-size:24px;animation:float 2s ease-in-out infinite}
@keyframes float{50%{transform:translateY(-5px)}}
.rrow{display:flex;align-items:center;gap:10px;background:var(--card);border:1px solid var(--line);border-radius:16px;padding:10px 12px;margin:8px 0;box-shadow:var(--shadow);width:100%;text-align:left;animation:viewin .3s ease-out both}
.rrow:hover{border-color:var(--acc)}
.rrow.me{background:var(--acc2);border-color:var(--acc)}
.rmain{display:flex;align-items:center;gap:10px;flex:1;min-width:0;background:none;border:0;padding:0;text-align:left;font:inherit;color:inherit}
.rrow .rk{font-weight:800;width:26px;text-align:center;font-size:17px;color:var(--mut)}
.rrow .mid{flex:1;min-width:0}
.rrow .mid b{display:flex;align-items:center;gap:6px;flex-wrap:wrap}
.rrow .mid small{display:block;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.rrow .xp{text-align:right;min-width:74px}
.rrow .xp b{font-size:17px;display:block;color:var(--acc-d)}
:root[data-theme=dark] .rrow .xp b{color:#fff}
.rrow .xbar{height:6px;background:var(--acc2);border-radius:99px;overflow:hidden;margin-top:4px}
.rrow .xbar div{height:100%;background:linear-gradient(90deg,#2f80ed,#0a2a6b)}
.rrow .chev,.alert .chev{color:var(--mut);font-size:20px}
.tag{display:inline-block;font-size:11px;font-weight:800;background:var(--acc);color:var(--accfg);border-radius:99px;padding:1px 8px}
.profstrip{display:flex;gap:10px;flex-wrap:wrap}
.proft{display:flex;align-items:center;gap:10px;background:linear-gradient(135deg,var(--goldbg),var(--card));border:1px solid var(--gold);border-radius:16px;padding:10px 14px;text-align:left}
.proft b{display:block;line-height:1.2}
.proft small{color:var(--gold-d);font-weight:700}
.callout{background:linear-gradient(135deg,var(--acc2),var(--card));border:1px solid var(--acc3);border-radius:16px;padding:12px 14px;margin:10px 0;font-weight:600}

/* ---------- TEACHER PANEL ---------- */
.kpis{display:grid;grid-template-columns:repeat(4,1fr);gap:10px;margin:12px 0}
@media(max-width:720px){.kpis{grid-template-columns:repeat(2,1fr)}}
.kpi{background:var(--card);border:1px solid var(--line);border-radius:16px;padding:12px 8px;text-align:center;box-shadow:var(--shadow)}
.kpi b{display:block;font-size:25px;line-height:1.15;color:var(--acc-d)}
:root[data-theme=dark] .kpi b{color:#fff}
.kpi span{font-size:12px;color:var(--mut)}
.kpis.gold .kpi{border-color:var(--gold);background:linear-gradient(180deg,var(--goldbg),var(--card))}
.alerts{display:grid;gap:8px}
.alert{display:flex;align-items:center;gap:10px;background:var(--card);border:1px solid var(--line);border-left:5px solid var(--gold);border-radius:14px;padding:10px 12px;text-align:left;width:100%}
.alert.bad{border-left-color:var(--bad)}
.alert .mid{flex:1;min-width:0}
.alert small{display:block}
.hmwrap{overflow-x:auto;border:1px solid var(--line);border-radius:14px;background:var(--card);-webkit-overflow-scrolling:touch}
table.hm{border:0;border-radius:0;min-width:680px}
table.hm th{font-size:11.5px;padding:8px 6px;text-align:center;white-space:nowrap}
table.hm th .es{font-size:10px;color:inherit;opacity:.75}
table.hm th:first-child,table.hm td:first-child{position:sticky;left:0;z-index:2;text-align:left;background:var(--card);min-width:112px}
table.hm th:first-child{background:var(--acc2)}
table.hm td{padding:6px 4px;text-align:center}
.hc{display:block;border:0;border-radius:9px;min-width:46px;padding:7px 2px;font-weight:800;font-size:13px;background:var(--line);color:var(--mut);width:100%}
.hc.l{background:var(--badbg);color:var(--bad)}
.hc.m{background:var(--acc3);color:var(--acc-d)}
:root[data-theme=dark] .hc.m{color:#fff}
.hc.h{background:var(--acc);color:var(--accfg)}
.legend{display:flex;gap:14px;font-size:12px;color:var(--mut);margin-top:6px;flex-wrap:wrap}
.legend i{display:inline-block;width:10px;height:10px;border-radius:3px;margin-right:5px;vertical-align:-1px}

/* ---------- PROGRESS ---------- */
.phead{display:flex;align-items:center;gap:14px;flex-wrap:wrap;margin-bottom:6px}
.phead h2{margin:0}
.chartbox{background:var(--card);border:1px solid var(--line);border-radius:16px;padding:12px;box-shadow:var(--shadow)}
.chartbox svg{display:block;width:100%;height:auto}
.chartbox text{fill:var(--mut);font-size:11px;font-family:inherit}
.chartbox .c-ok{fill:var(--acc)}.chartbox .c-no{fill:var(--acc3)}
.chartbox .gl{stroke:var(--line);stroke-width:1}
.chartbox .ln{fill:none;stroke:var(--acc);stroke-width:2.5;stroke-linejoin:round}
.chartbox .dt{fill:var(--card);stroke:var(--acc);stroke-width:2}
.mini{display:inline-block;width:80px;height:8px;background:var(--acc2);border-radius:99px;overflow:hidden;vertical-align:middle;margin-right:8px}
.mini div{height:100%;background:var(--acc)}
.field{display:flex;flex-direction:column;gap:4px;margin:8px 0}
.field label{font-size:13px;font-weight:700}
.field input{width:100%}
.smsg{font-size:13px;color:var(--mut);margin-top:8px}

/* ---------- SETTINGS SHEET ---------- */
.ov{position:fixed;inset:0;z-index:60;background:rgba(5,15,43,.55);display:flex;align-items:flex-end;justify-content:center;animation:fade .2s both}
@keyframes fade{from{opacity:0}}
.sheet{background:var(--card);width:100%;max-width:520px;border-radius:24px 24px 0 0;padding:18px 18px calc(18px + env(safe-area-inset-bottom));max-height:88vh;overflow:auto;animation:slideup .28s cubic-bezier(.2,.8,.2,1) both}
@keyframes slideup{from{transform:translateY(40px);opacity:0}}
.sheet h3{margin:0 0 12px;font-size:19px}
.sheet h3::after{display:none}
.sheet .row{display:flex;align-items:center;justify-content:space-between;gap:12px;padding:10px 0;border-bottom:1px solid var(--line)}
.sheet .row:last-of-type{border-bottom:0}
.sheet .row label{font-weight:700;font-size:14px}
.sheet select{max-width:200px}
.sheet input[type=range]{max-width:150px;accent-color:var(--acc)}
.sw2{position:relative;width:50px;height:30px;border-radius:99px;border:0;background:var(--line);transition:background .2s;flex:none}
.sw2::after{content:"";position:absolute;top:3px;left:3px;width:24px;height:24px;border-radius:50%;background:#fff;box-shadow:0 1px 4px rgba(0,0,0,.3);transition:transform .2s}
.sw2[aria-checked=true]{background:var(--acc)}
.sw2[aria-checked=true]::after{transform:translateX(20px)}
@media(min-width:721px){.ov{align-items:center}.sheet{border-radius:24px}}

/* ---------- EFFECTS ---------- */
#fx{position:fixed;inset:0;pointer-events:none;z-index:80;overflow:hidden}
.cf{position:absolute;top:-16px;width:9px;height:14px;border-radius:2px;animation:fall var(--d) cubic-bezier(.3,.6,.5,1) forwards}
@keyframes fall{to{transform:translate(var(--x),105vh) rotate(var(--r));opacity:.9}}
.xppop{position:absolute;left:50%;top:46%;transform:translateX(-50%);font-weight:900;font-size:30px;color:var(--acc);text-shadow:0 2px 10px rgba(20,86,200,.35);animation:popup 1s ease-out forwards}
.xppop.gold{color:var(--gold)}
@keyframes popup{from{opacity:0;transform:translate(-50%,10px) scale(.7)}25%{opacity:1;transform:translate(-50%,-6px) scale(1.15)}to{opacity:0;transform:translate(-50%,-70px) scale(1)}}
.banner{position:absolute;left:50%;top:32%;transform:translate(-50%,-50%);background:var(--hero);color:#fff;border-radius:26px;padding:22px 34px;text-align:center;box-shadow:0 20px 50px rgba(10,42,107,.5);animation:bnr 2.6s cubic-bezier(.2,.8,.2,1) forwards;max-width:86vw}
.banner b{display:block;font-size:30px}
.banner.gold{background:linear-gradient(135deg,#ffd45c,#f5b800);color:#241a00}
@keyframes bnr{0%{opacity:0;transform:translate(-50%,-50%) scale(.6)}14%{opacity:1;transform:translate(-50%,-50%) scale(1.05)}22%{transform:translate(-50%,-50%) scale(1)}84%{opacity:1}100%{opacity:0;transform:translate(-50%,-60%) scale(.98)}}
#toast{position:fixed;left:50%;bottom:calc(var(--bn-h) + 22px);transform:translateX(-50%);background:#0a2a6b;color:#fff;padding:11px 18px;border-radius:14px;z-index:90;max-width:90%;font-size:14px;box-shadow:0 8px 24px rgba(0,0,0,.3);text-align:center}
body.inquiz #toast{bottom:22px}
@media(min-width:721px){#toast{bottom:24px}}
.fire-anim{display:inline-block;animation:flame .9s ease-in-out infinite alternate}
@keyframes flame{to{transform:scale(1.18) rotate(-6deg)}}
</style>
</head>
<body>
<header class="top" id="hdr">
  <div class="topin">
    <div class="logo"><span class="lg" aria-hidden="true">EP</span><span>English <em>Practice</em></span></div>
    <div class="sp"></div>
    <div class="stat" id="stXP" hidden>⭐ 0</div>
    <div class="stat fire" id="stStreak" hidden>🔥 0</div>
    <div class="stat lv" id="stLevel" hidden>Level 1</div>
    <button class="ibtn" id="micChip" type="button" aria-pressed="false" aria-label="Microphone off">🎙️<span class="lbl">off</span></button>
    <button class="ibtn" id="gearBtn" type="button" aria-label="Settings">⚙️</button>
    <button class="userchip" id="userChip" type="button" aria-label="Switch profile" hidden></button>
  </div>
  <nav class="tabs" id="tabs" aria-label="Sections"></nav>
</header>
<main id="view"></main>
<nav class="bnav" id="bnav" aria-label="Main navigation"></nav>
<div id="sheetHost"></div>

var ONES=['zero','one','two','three','four','five','six','seven','eight','nine','ten','eleven','twelve','thirteen','fourteen','fifteen','sixteen','seventeen','eighteen','nineteen'];
var TENS=['','','twenty','thirty','forty','fifty','sixty','seventy','eighty','ninety'];
function numWords(n){
  n=Math.floor(n);
  if(n<20)return ONES[n];
  if(n<100){var o=n%10;return TENS[Math.floor(n/10)]+(o?'-'+ONES[o]:'');}
  if(n<1000){var r=n%100;return ONES[Math.floor(n/100)]+' hundred'+(r?' and '+numWords(r):'');}
  if(n===1000)return 'one thousand';
  return String(n);
}
var STRESS_TEEN={13:'thir-TEEN',14:'four-TEEN',15:'fif-TEEN',16:'six-TEEN',17:'seven-TEEN',18:'eigh-TEEN',19:'nine-TEEN'};

/* ============================================================
   NORMALIZATION AND COMPARISON
   ============================================================ */
function expand(s){
  return s.replace(/[’‘]/g,"'")
    .replace(/\bi'm\b/g,'i am')
    .replace(/\b(you|we|they)'re\b/g,'$1 are')
    .replace(/\b(he|she|it|that|there|what|who)'s\b/g,'$1 is')
    .replace(/\b(is|are|was|were|do|does|did)n't\b/g,'$1 not')
    .replace(/\bcan't\b/g,'can not');
}
function normText(s,mode){
  s=expand(String(s).toLowerCase().trim());
  s=s.replace(/\d+/g,function(m){return ' '+numWords(+m)+' ';});
  s=s.replace(/[^a-z' ]/g,' ').replace(/\s+/g,' ').trim();
  if(mode==='num')s=(' '+s+' ').replace(/ and /g,' ').trim();
  return s;
}
function checkType(q,val){
  val=String(val||'').trim();
  if(!val)return false;
  if(q.cmp==='letters'){var f=function(x){return x.toLowerCase().replace(/[^a-z0-9]/g,'');};return f(val)===f(q.answer);}
  if(q.cmp==='email'){return val.toLowerCase().replace(/\s+/g,'')===q.answer.toLowerCase();}
  var acc=[q.answer].concat(q.accept||[]);
  var m=q.cmp==='num'?'num':'';
  var nv=normText(val,m);
  return acc.some(function(a){return normText(a,m)===nv;});
}
function lev(a,b){
  var m=a.length,n=b.length,d=[],i,j;
  for(i=0;i<=m;i++){d[i]=[i];}
  for(j=1;j<=n;j++){d[0][j]=j;}
  for(i=1;i<=m;i++)for(j=1;j<=n;j++){
    d[i][j]=Math.min(d[i-1][j]+1,d[i][j-1]+1,d[i-1][j-1]+(a[i-1]===b[j-1]?0:1));
  }
  return d[m][n];
}
function sim(a,b){var L=Math.max(a.length,b.length);return L?1-lev(a,b)/L:1;}
function tokens(s){return normText(s,'num').split(' ').filter(Boolean);}
function scoreSpeech(target,alts,accept){
  var tt=tokens(target),best={score:0,marks:tt.map(function(w){return {w:w,ok:false};}),heard:alts[0]||''};
  for(var a=0;a<alts.length;a++){
    var alt=alts[a],ht=tokens(alt);
    if(accept&&accept.length){
      var joined=ht.join(' ');
      if(accept.indexOf(joined)>-1||ht.some(function(x){return accept.indexOf(x)>-1;})){
        return {score:1,marks:tt.map(function(w){return {w:w,ok:true};}),heard:alt};
      }
    }
    var used={},marks=[],ok=0;
    tt.forEach(function(w){
      var bi2=-1,bs=0;
      ht.forEach(function(x,i){if(used[i])return;var s=sim(w,x);if(s>bs){bs=s;bi2=i;}});
      if(bi2>-1&&bs>=0.72){used[bi2]=true;ok++;marks.push({w:w,ok:true});}else marks.push({w:w,ok:false});
    });
    var sc=tt.length?ok/tt.length:0;
    if(sc>best.score||a===0&&sc>=best.score){best={score:sc,marks:marks,heard:alt};}
  }
  return best;
}

var TTS=('speechSynthesis' in window)&&('SpeechSynthesisUtterance' in window);
var SR=window.SpeechRecognition||window.webkitSpeechRecognition;
var voices=[];
function loadVoices(){
  if(!TTS)return;
  voices=speechSynthesis.getVoices().filter(function(v){return /^en/i.test(v.lang);});
  if(!voices.length)return;
  var cur=voices.filter(function(v){return v.name===CFG.voice;})[0];
  if(!cur){
    cur=voices.filter(function(v){return /natural|online/i.test(v.name)&&/en-US/i.test(v.lang);})[0]||
        voices.filter(function(v){return /en[-_]US/i.test(v.lang);})[0]||voices[0];
    CFG.voice=cur.name;
  }
}
function curVoice(){return voices.filter(function(v){return v.name===CFG.voice;})[0]||null;}
function say(text,rate){
  return new Promise(function(res){
    if(!TTS){res();return;}
    var u=new SpeechSynthesisUtterance(text);
    u.lang='en-US';var v=curVoice();if(v){u.voice=v;u.lang=v.lang;}
    u.rate=rate||CFG.rate;
    u.onend=u.onerror=function(){res();};
    speechSynthesis.speak(u);
  });
}
function spellTokens(str){
  var out=[];
  str.split('').forEach(function(ch){
    var U=ch.toUpperCase();
    if(SAY_LETTER[U]&&/[a-z]/i.test(ch))out.push(SAY_LETTER[U]);
    else if(/\d/.test(ch))out.push(ONES[+ch]);
    else if(ch==='.')out.push('dot');
    else if(ch==='@')out.push('at');
    else if(ch==='-')out.push('dash');
    else if(ch==='_')out.push('underscore');
    else if(ch===' ')out.push(null);
  });
  return out;
}
var playTok=0;
async function playAudio(a,slow){
  if(!a)return;
  if(!TTS){toast(I('Your browser has no built-in voice. Try Chrome or Edge.','Tu navegador no tiene voz integrada. Prueba con Chrome o Edge.'));return;}
  var t=++playTok;
  speechSynthesis.cancel();
  await sleep(70);
  var rate=slow?Math.min(0.6,CFG.rate):CFG.rate;
  if(a.text){await say(a.text,rate);return;}
  if(a.spell){
    var tk=spellTokens(a.spell);
    for(var i=0;i<tk.length;i++){
      if(t!==playTok)return;
      if(tk[i]===null){await sleep(500);continue;}
      await say(tk[i],rate);
      await sleep(slow?520:300);
    }
  }
}

var AC=null;
function tone(freq,t0,dur,type,vol){
  try{
    if(!AC){var C=window.AudioContext||window.webkitAudioContext;if(!C)return;AC=new C();}
    if(AC.state==='suspended')AC.resume();
    var o=AC.createOscillator(),g=AC.createGain();
    o.type=type||'sine';o.frequency.value=freq;
    var t=AC.currentTime+t0;
    g.gain.setValueAtTime(0.0001,t);g.gain.exponentialRampToValueAtTime(vol||0.12,t+0.02);g.gain.exponentialRampToValueAtTime(0.0001,t+dur);
    o.connect(g);g.connect(AC.destination);o.start(t);o.stop(t+dur+0.05);
  }catch(e){}
}
function sfx(kind){
  if(CFG.sound===false)return;
  if(kind==='ok'){tone(660,0,0.12,'sine');tone(880,0.1,0.18,'sine');}
  else if(kind==='bad'){tone(200,0,0.22,'sawtooth',0.07);tone(150,0.12,0.25,'sawtooth',0.07);}
  else if(kind==='win'){[523,659,784,1047].forEach(function(f,i){tone(f,i*0.11,0.22,'triangle',0.13);});}
  else if(kind==='lvl'){[392,523,659,784,1047].forEach(function(f,i){tone(f,i*0.09,0.26,'triangle',0.13);});}
}

var Mic={
  stream:null,rec:null,wanted:false,running:false,win:null,idle:null,restarts:[],
  touch:function(){

  chip:function(){

      try{m.stream=await navigator.mediaDevices.getUserMedia({audio:true});}

    r.onend=function(){
      m.running=false;
      if(m.wanted)setTimeout(function(){if(m.wanted&&!m.running)m.start();},250);
      else m.chip();
    };
    m.rec=r;
    try{r.start();m.running=true;}catch(e){m.running=false;}
  },
  result:function(e){
    var w=this.win;if(!w)return;
    for(var i=e.resultIndex;i<e.results.length;i++){
      var r=e.results[i],alts=[];
      for(var j=0;j<r.length;j++)alts.push(r[j].transcript);
      if(!alts.length)continue;
      w.interim=alts;
      if(w.onInterim)w.onInterim(alts[0]);
      if(r.isFinal){w.done(alts);return;}
    }
    clearTimeout(w.silence);
    w.silence=setTimeout(function(){if(w.interim&&w.interim[0])w.done(w.interim);},1700);
  },
  closeWin:function(reason){
    var w=this.win;
    if(w){this.win=null;w.reject(reason||'aborted');}
  },
  cancel:function(){this.closeWin('aborted');},
  listen:function(onInterim){
    var m=this;m.touch();m.closeWin('aborted');
    return new Promise(function(resolve,reject){
      var w={interim:null,onInterim:onInterim,finished:false};
      function clear(){clearTimeout(w.silence);clearTimeout(w.max);}
      w.done=function(a){if(w.finished)return;w.finished=true;clear();if(m.win===w)m.win=null;resolve(a);};
      w.reject=function(c){if(w.finished)return;w.finished=true;clear();if(m.win===w)m.win=null;reject(c);};
      w.max=setTimeout(function(){
        if(w.interim&&w.interim[0])w.done(w.interim);else w.reject('no-speech');
      },9000);
      m.win=w;
      if(!m.running&&m.wanted)m.start();
    });
  },
  ask:async function(onInterim){
    await this.enable();
    return this.listen(onInterim);
  }
};

def('be_order','🧱','Put it in order|Ordena la frase','Build the sentence with the words.|Arma la oración con las palabras.','be',function(){
  var p=beParts(),t=pick(['aff','neg','q']),txt;

  var en={aff:'statement',neg:'negative sentence',q:'question'}[t],es={aff:'afirmación',neg:'negación',q:'pregunta'}[t];
  return {kind:'order',prompt:I('Put the words in order to make a <b>'+en+'</b>.','Ordena las palabras para formar una <b>'+es+'</b>.'),words:sh,answer:txt,explain:I('Correct sentence: <b>'+txt+'</b>','')};

function lvl(u){return Math.floor(u.xp/200)+1;}
function totals(u){var q=0,c=0;Object.keys(u.stats).forEach(function(k){q+=u.stats[k].t;c+=u.stats[k].c;});return {q:q,c:c,acc:q?Math.round(c/q*100):0};}
function weekXP(u){var s=0,i;for(i=0;i<7;i++){var d=new Date();d.setDate(d.getDate()-i);var x=u.daily[dayKey(d)];if(x)s+=x.xp||0;}return s;}
function todayQ(u){var x=u.daily[dayKey()];return x?x.q:0;}
function dayStreak(u){
  var n=0,d=new Date(),x=u.daily[dayKey(d)];
  if(!(x&&x.q>0))d.setDate(d.getDate()-1);
  while((x=u.daily[dayKey(d)])&&x.q>0){n++;d.setDate(d.getDate()-1);}
  return n;
}
function activeDays7(u){var n=0,i;for(i=0;i<7;i++){var d=new Date();d.setDate(d.getDate()-i);var x=u.daily[dayKey(d)];if(x&&x.q>0)n++;}return n;}
function lastAct(u){var t=u.updated||0;if(u.history.length)t=Math.max(t,u.history[u.history.length-1].ts);return t;}
function ago(ts){
  if(!ts)return 'never';
  var m=Math.floor((Date.now()-ts)/60000);
  if(m<1)return 'just now';
  if(m<60)return m+' min ago';
  var hh=Math.floor(m/60);if(hh<24)return hh+' h ago';
  var d=Math.floor(hh/24);return d===1?'yesterday':d+' days ago';
}
function weakest(u){
  var w=null,wp=101;
  Object.keys(TOPICS).forEach(function(k){var st=u.stats[k];if(!st||st.t<3)return;var pc=Math.round(st.c/st.t*100);if(pc<wp){wp=pc;w=k;}});
  return w?{k:w,pc:wp}:null;
}
function fmtDate(ts){
  var d=new Date(ts);
  return d.toLocaleDateString('en-US',{day:'2-digit',month:'short'})+' '+d.toLocaleTimeString('en-US',{hour:'2-digit',minute:'2-digit'});
}

}
function topicPct(u,keys){var c=0,t=0;keys.forEach(function(k){var s=u.stats[k];if(s){c+=s.c;t+=s.t;}});return t?Math.round(c/t*100):null;}

   QUIZ SESSION

var sess=null;
function qKey(q){return JSON.stringify([q.prompt,q.answer,q.target||'',q.audio||'']);}
function startQuiz(id,opts){
  opts=opts||{};
  stopAll();
  var d=QZ[id]||{id:id,icon:opts.icon||'🎯',title:opts.title||'Quiz',topic:'vocab',gen:opts.gen};
  var n=opts.n||parseInt(CFG.qn,10)||10,qs=[],seen={},tries=0;
  if(opts.list){qs=opts.list.slice(0,n);}
  else{
    while(qs.length<n&&tries<n*25){
      tries++;
      var q=(d.gen||opts.gen)();
      if(!q)continue;
      q.topic=q.topic||d.topic;
      var k=qKey(q);
      if(seen[k])continue;
      seen[k]=1;qs.push(q);
    }
  }
  if(!qs.length){toast(I('No questions available.','No hay preguntas disponibles.'));return;}
  sess={id:id,title:spl(opts.title||d.title).en,icon:opts.icon||d.icon,qs:qs,i:0,score:0,wrong:[],back:opts.back||'home',review:!!opts.review,xp0:S.xp,lv0:lvl(S),timer:opts.timer||0,bonus:0};
  renderQ();
  window.scrollTo(0,0);
}
function record(q,ok,bonus){
  var t=q.topic||'vocab';
  S.stats[t]=S.stats[t]||{c:0,t:0};
  S.stats[t].t++;
  var gain=0;
  if(ok){S.stats[t].c++;S.streak++;S.best=Math.max(S.best,S.streak);gain=10+Math.min(S.streak,5)+(bonus||0);S.xp+=gain;if(sess)sess.bonus+=(bonus||0);}
  else S.streak=0;
  var dk=dayKey(),dd=S.daily[dk]||(S.daily[dk]={q:0,c:0,xp:0});
  dd.q++;if(ok)dd.c++;dd.xp+=gain;
  if(!S.first)S.first=Date.now();
  S.updated=Date.now();
  var k=qKey(q);
  if(!ok){
    if(!S.mistakes.some(function(m){return qKey(m)===k;})){S.mistakes.push(q);if(S.mistakes.length>80)S.mistakes.shift();}
  }else if(sess&&sess.review){S.mistakes=S.mistakes.filter(function(m){return qKey(m)!==k;});}
  save();renderStats();
  return gain;
}
function endSession(){
  if(!sess||sess.logged)return;
  sess.logged=true;
  var tot=sess.qs.length;
  S.sessions=(S.sessions||0)+1;
  S.history.push({ts:Date.now(),id:sess.id,title:sess.title,icon:sess.icon,score:sess.score,total:tot,pct:Math.round(sess.score/tot*100)});
  if(S.history.length>200)S.history=S.history.slice(-200);
  var keys=Object.keys(S.daily).sort();
  while(keys.length>120)delete S.daily[keys.shift()];
  sess.newBadges=checkBadges();
  S.updated=Date.now();
  save();
  cloudPush(USER);
}

function micLabel(state){

}
function renderQ(){
  var q=sess.qs[sess.i],answered=false,attempts=0,remain=0,tbar=null,tlab=null;
  document.body.classList.add('inquiz');
  var v=$('#view');v.innerHTML='';
  var wrap=h('div',{class:'qcard'});
  tlab=sess.timer?h('span',{class:'timer'},''):null;
  wrap.append(h('div',{class:'qhead'},
    h('button',{class:'btn ghost sm',type:'button',onclick:function(){stopAll();go(sess.back);}},bi('← Exit','Salir',true)),
    h('span',{class:'chip'},sess.icon+' '+sess.title),
    h('span',{class:'sp'}),
    tlab,
    h('span',{class:'qnum'},(sess.i+1)+' / '+sess.qs.length),
    h('span',{class:'qscore'},'✔ '+sess.score)));
  wrap.append(h('div',{class:'bar'},h('div',{style:'width:'+(sess.i/sess.qs.length*100)+'%'})));
  if(sess.timer){tbar=h('div',{class:'tbar'},h('div'));wrap.append(tbar);}
  var qp=h('div',{class:'qprompt',html:q.prompt});hydrateFlags(qp);wrap.append(qp);
  if(q.audio){
    wrap.append(h('div',{class:'arow'},
      h('button',{class:'btn big',type:'button',onclick:function(){playAudio(q.audio);}},bi('🔊 Listen','Escuchar')),
      h('button',{class:'btn',type:'button',onclick:function(){playAudio(q.audio,true);}},bi('🐢 Slower','Más lento'))));
    setTimeout(function(){if(sess&&sess.qs[sess.i]===q)playAudio(q.audio);},300);
  }
  var body=h('div',{class:'qbody'});wrap.append(body);
  var fb=h('div',{class:'fb','aria-live':'polite'});wrap.append(fb);
  var last=sess.i===sess.qs.length-1;
  var nxt=h('button',{class:'btn pri',type:'button',onclick:function(){stopAll();if(last)renderResult();else{sess.i++;renderQ();}}},last?bi('See results ✓','Ver resultados'):bi('Next →','Siguiente'));
  nxt.hidden=true;
  wrap.append(h('div',{class:'nextrow'},nxt));
  v.append(wrap);

  function lockAll(){
    Array.prototype.forEach.call(body.querySelectorAll('button,input'),function(x){x.disabled=true;});
    Array.prototype.forEach.call(body.querySelectorAll('.opt'),function(x){if(x.dataset.v===q.answer)x.classList.add('ok');});
  }
  function finish(ok,shown){
    if(answered)return;answered=true;
    if(tmrId){clearInterval(tmrId);tmrId=null;}
    var lv1=lvl(S);
    var bonus=(ok&&sess.timer)?Math.max(1,Math.ceil(remain/3)):0;
    if(ok)sess.score++;else sess.wrong.push(q);
    var gain=record(q,ok,bonus);
    var ans=q.kind==='speak'?q.target:q.answer;
    fb.className='fb '+(ok?'ok':'bad');
    fb.innerHTML=(ok?II('✅ <b>Correct!</b>','¡Correcto!')+(gain?' <span class="chip">+'+gain+' XP'+(bonus?' · ⚡ bonus '+bonus:'')+'</span>':''):II('❌ <b>Not quite.</b> Answer: <b>'+ans+'</b>','Incorrecto. Respuesta: '+ans))
      +(shown?'<div class="hint">'+II('Your answer: '+esc(shown),'Tu respuesta')+'</div>':'')
      +(q.explain?'<div style="margin-top:6px">'+q.explain+'</div>':'');
    hydrateFlags(fb);
    sfx(ok?'ok':'bad');buzz(ok?18:[40,50,40]);
    if(ok)xpPop('+'+gain,bonus>0);
    if(lvl(S)>lv1){setTimeout(function(){sfx('lvl');confetti(50);banner('Level '+lvl(S)+'!',I('Keep going 🚀','¡Sigue así!'),true);},500);}
    nxt.hidden=false;setTimeout(function(){nxt.focus({preventScroll:true});},250);
    wrap.querySelector('.qscore').textContent='✔ '+sess.score;
    try{nxt.scrollIntoView({block:'nearest',behavior:'smooth'});}catch(e){}
  }
  if(sess.timer&&q.kind!=='speak'){
    var total=((q.audio?sess.timer+7:sess.timer))*1000,t0=Date.now();remain=total/1000;
    tmrId=setInterval(function(){
      var left=Math.max(0,total-(Date.now()-t0));remain=left/1000;
      tbar.firstChild.style.width=(left/total*100)+'%';
      tlab.textContent='⏱ '+Math.ceil(left/1000)+'s';
      tbar.classList.toggle('low',left<4000);
      if(left<=0&&!answered){clearInterval(tmrId);tmrId=null;lockAll();finish(false,"⏱ time's up");}
    },100);
    tlab.textContent='⏱ '+Math.ceil(total/1000)+'s';
  }

  if(q.kind==='mc'){
    var long1=q.options.some(function(o){return typeof o!=='object'&&String(o).length>16;});
    var anyEmoji=q.options.some(function(o){return typeof o==='object'&&o.emoji;});
    var opts=h('div',{class:'opts'+(long1?' col1':'')+(q.flagsOnly?' flagsonly':'')+(anyEmoji?' emojionly':''),role:'group'});
    q.options.forEach(function(o,idx){
      var isObj=typeof o==='object',val=isObj?o.value:o;
      var vis=isObj&&(o.iso||o.emoji);
      var lab=isObj?(o.label!==undefined?o.label:val):val;
      var aria=isObj?(lab||(o.iso?'Flag '+(idx+1):o.emoji?'Picture '+(idx+1):'Color '+(idx+1))):val;
      var kids=[];
      if(isObj&&o.iso)kids.push(flagEl(o.iso,q.flagsOnly?56:40,true));
      else if(isObj&&o.emoji)kids.push(h('span',{class:'opemoji','aria-hidden':'true'},o.emoji));
      else if(isObj&&o.color)kids.push(h('span',{class:'sw',style:'width:44px;height:44px;background:'+o.color}));
      if(lab){kids.push(isObj?h('span',{class:'lb'},lab,o.es?h('span',{class:'es'},o.es):null):lab);}
      var b=h('button',{class:'opt'+(vis?' fo':''),type:'button','aria-label':aria},kids);
      b.dataset.v=val;
      b.addEventListener('click',function(){
        if(answered)return;
        var ok=val===q.answer;
        Array.prototype.forEach.call(opts.children,function(x){x.disabled=true;if(x.dataset.v===q.answer)x.classList.add('ok');});
        if(!ok)b.classList.add('bad');
        finish(ok,null);
      });
      opts.append(b);
    });
    body.append(opts);
    sess.keys=function(e){
      var n=parseInt(e.key,10);
      if(!answered&&n>=1&&n<=q.options.length&&opts.children[n-1])opts.children[n-1].click();
    };
  }
  else if(q.kind==='type'){
    var inp=h('input',{type:'text',autocomplete:'off',autocapitalize:'none',autocorrect:'off',spellcheck:'false','aria-label':'Your answer',placeholder:'Type here…',enterkeyhint:'done'});
    var chk=h('button',{class:'btn pri',type:'button'},bi('Check','Comprobar'));
    var skip=h('button',{class:'btn ghost',type:'button'},bi("I don't know",'No sé'));
    function submit(){if(answered)return;var val=inp.value;if(!val.trim()){inp.focus();return;}var ok=checkType(q,val);inp.disabled=true;chk.disabled=true;skip.disabled=true;finish(ok,val);}
    chk.addEventListener('click',submit);
    skip.addEventListener('click',function(){if(answered)return;inp.disabled=true;chk.disabled=true;skip.disabled=true;finish(false,'(no answer)');});
    inp.addEventListener('keydown',function(e){if(e.key==='Enter')submit();});
    body.append(h('div',{class:'typerow'},inp,chk,skip));
    if(q.hint)body.append(h('div',{class:'hint',html:'💡 '+q.hint}));
    setTimeout(function(){inp.focus({preventScroll:true});},50);
    sess.keys=null;
  }
  else if(q.kind==='order'){
    var bank=h('div',{class:'bank'}),ans=h('div',{class:'ans'});
    var items=q.words.map(function(w,i){return {w:w,i:i,placed:false};});
    var cnt=0;
    function draw(){
      bank.innerHTML='';ans.innerHTML='';
      var placed=items.filter(function(x){return x.placed;}).sort(function(a,b){return (a.ord||0)-(b.ord||0);});
      items.forEach(function(it){if(!it.placed)bank.append(h('button',{type:'button',onclick:function(){if(answered)return;it.placed=true;it.ord=++cnt;draw();}},it.w));});
      placed.forEach(function(it){ans.append(h('button',{type:'button',onclick:function(){if(answered)return;it.placed=false;draw();}},it.w));});
    }
    draw();
    var ck=h('button',{class:'btn pri',type:'button',onclick:function(){

function chartDays(u){
  var days=[],i;
  for(i=13;i>=0;i--){var d=new Date();d.setDate(d.getDate()-i);days.push(d);}
  var max=1;
  days.forEach(function(d){var x=u.daily[dayKey(d)];if(x&&x.q>max)max=x.q;});
  var W=640,H=180,pl=32,pr=8,pt=12,pb=26,cw=W-pl-pr,ch=H-pt-pb,bw=cw/14;
  var s='<svg viewBox="0 0 '+W+' '+H+'" role="img" aria-label="Questions answered per day, last 14 days">';
  [0,0.5,1].forEach(function(f){
    var y=pt+ch-ch*f;
    s+='<line class="gl" x1="'+pl+'" x2="'+(W-pr)+'" y1="'+y+'" y2="'+y+'"/><text x="'+(pl-6)+'" y="'+(y+4)+'" text-anchor="end">'+Math.round(max*f)+'</text>';
  });
  days.forEach(function(d,idx){
    var x=u.daily[dayKey(d)]||{q:0,c:0,xp:0},bx=pl+idx*bw+bw*0.18,bwid=bw*0.64;
    var th=ch*x.q/max,chh=x.q?th*x.c/x.q:0;
    if(x.q){
      var tip=d.toLocaleDateString('en-US',{day:'numeric',month:'short'})+': '+x.q+' questions, '+x.c+' correct, '+x.xp+' XP';
      s+='<g><title>'+tip+'</title><rect class="c-no" x="'+bx.toFixed(1)+'" y="'+(pt+ch-th).toFixed(1)+'" width="'+bwid.toFixed(1)+'" height="'+th.toFixed(1)+'" rx="3"/><rect class="c-ok" x="'+bx.toFixed(1)+'" y="'+(pt+ch-chh).toFixed(1)+'" width="'+bwid.toFixed(1)+'" height="'+chh.toFixed(1)+'" rx="3"/></g>';
    }
    s+='<text x="'+(bx+bwid/2).toFixed(1)+'" y="'+(H-8)+'" text-anchor="middle">'+d.getDate()+'</text>';
  });
  return s+'</svg>';
}
function chartTrend(u){
  var hs=u.history.slice(-20);
  if(hs.length<2)return null;
  var W=640,H=170,pl=42,pr=14,pt=12,pb=22,cw=W-pl-pr,ch=H-pt-pb,n=hs.length;
  var s='<svg viewBox="0 0 '+W+' '+H+'" role="img" aria-label="Results of the last quizzes">';
  [0,50,100].forEach(function(f){
    var y=pt+ch-ch*f/100;
    s+='<line class="gl" x1="'+pl+'" x2="'+(W-pr)+'" y1="'+y+'" y2="'+y+'"/><text x="'+(pl-6)+'" y="'+(y+4)+'" text-anchor="end">'+f+'%</text>';
  });
  var pts=hs.map(function(e,i){return [pl+i*(cw/(n-1)),pt+ch-ch*e.pct/100,e];});
  s+='<polyline class="ln" points="'+pts.map(function(p){return p[0].toFixed(1)+','+p[1].toFixed(1);}).join(' ')+'"/>';
  pts.forEach(function(p){
    s+='<circle class="dt" cx="'+p[0].toFixed(1)+'" cy="'+p[1].toFixed(1)+'" r="4"><title>'+fmtDate(p[2].ts)+' · '+p[2].title+': '+p[2].pct+'%</title></circle>';
  });
  return s+'</svg>';
}

function teamCSV(){
  var cols=['Profile','Role','XP','Level','Quizzes','Questions','Accuracy %','Best streak','XP 7 days','Last activity'].concat(Object.keys(TOPICS).map(function(k){return TOPICS[k]+' %';}));
  var all=rankedStudents().concat(teachers().map(function(p){return metrics(p.id);}));
  var q=function(x){return '"'+String(x).replace(/"/g,'""')+'"';};
  var lines=[cols.map(q).join(';')];
  all.forEach(function(m){
    var row=[m.p.label,roleName(m.p),m.xp,m.level,m.sessions,m.q,m.acc,m.best,m.week,m.last?new Date(m.last).toLocaleString('en-US'):''];

async function cloudPush(id){
  if(!cloudOn()||!id||!DB.users[id]||!DB.users[id].updated)return false;
  try{
    var r=await fetch(CFG.cloudUrl,{method:'POST',body:JSON.stringify({action:'save',key:CFG.cloudKey,id:id,name:profileOf(id).label,data:summaryOf(id)})});
    var j=await r.json();
    if(j&&j.ok){CFG.lastSync=Date.now();saveCfg();setSyncMsg();return true;}
    setSyncMsg('⚠️ The service replied: '+esc((j&&j.error)||'unknown error'));return false;
  }catch(e){setSyncMsg(I('⚠️ Could not reach the service.','No se pudo conectar con el servicio.'));return false;}
}
function mergeUsers(remote,full){
  var n=0;
  Object.keys(remote).forEach(function(id){
    var u=DB.users[id],r=remote[id];
    if(!u||!r)return;
    if((r.updated||0)>(u.updated||0)){
      ['xp','best','streak','sessions','stats','history','daily','badges','first','updated'].forEach(function(k){if(r[k]!=null)u[k]=r[k];});
      if(full&&Array.isArray(r.mistakes))u.mistakes=r.mistakes;
      n++;
    }
  });
  if(n){save();if(USER)S=DB.users[USER];renderStats();}
  return n;
}
async function cloudPull(){
  if(!cloudOn())return 0;
  try{
    var r=await fetch(CFG.cloudUrl+(CFG.cloudUrl.indexOf('?')>-1?'&':'?')+'key='+encodeURIComponent(CFG.cloudKey||''));
    var j=await r.json();
    if(!j||!j.ok){setSyncMsg('⚠️ The service replied: '+esc((j&&j.error)||'unknown error'));return 0;}
    var n=mergeUsers(j.users||{});
    CFG.lastSync=Date.now();saveCfg();setSyncMsg();
    return n;
  }catch(e){setSyncMsg(I('⚠️ Could not reach the service.','No se pudo conectar con el servicio.'));return 0;}
}
async function syncAll(){
  var n=await cloudPull();
  for(var i=0;i<PROFILES.length;i++){await cloudPush(PROFILES[i].id);}
  return n;
}

/* ============================================================
   SETTINGS (bottom sheet)
   ============================================================ */
function closeSheet(){var host=$('#sheetHost');if(host)host.innerHTML='';}
function applyTheme(){
  var th=CFG.theme||(window.matchMedia&&matchMedia('(prefers-color-scheme: dark)').matches?'dark':'light');
  document.documentElement.setAttribute('data-theme',th);
  var m=document.querySelector('meta[name=theme-color]');if(m)m.setAttribute('content',th==='dark'?'#0a1f4d':'#0a2a6b');
}
function applyEs(){document.body.classList.toggle('noes',CFG.es===false);}
function openSettings(){
  closeSheet();
  var host=$('#sheetHost');
  var ov=h('div',{class:'ov',onclick:function(e){if(e.target===ov)closeSheet();}});
  var sh=h('div',{class:'sheet',role:'dialog','aria-modal':'true','aria-label':'Settings'});
  var vs=h('select',{id:'voiceSel','aria-label':'English voice'});
  if(voices.length){voices.forEach(function(v){vs.append(h('option',{value:v.name},v.name+' ('+v.lang+')'));});vs.value=CFG.voice;}
  else vs.append(h('option',{value:''},TTS?'Default voice':'No voice available'));
  vs.addEventListener('change',function(){CFG.voice=vs.value;saveCfg();});
  var rate=h('input',{id:'rate',type:'range',min:'0.5',max:'1.2',step:'0.05',value:String(CFG.rate),'aria-label':'Voice speed'});
  var rv=h('span',{id:'rateVal',style:'min-width:34px;text-align:right;font-size:13px'},Number(CFG.rate).toFixed(2));
  rate.addEventListener('input',function(){CFG.rate=parseFloat(rate.value)||0.9;rv.textContent=CFG.rate.toFixed(2);saveCfg();});
  var qn=h('select',{id:'qn','aria-label':'Questions per quiz'},[5,10,15,20].map(function(n){return h('option',{value:String(n)},String(n));}));
  qn.value=String(CFG.qn);
  qn.addEventListener('change',function(){CFG.qn=parseInt(qn.value,10)||10;saveCfg();});
  function sw(id,label,on,fn){
    var b=h('button',{id:id,type:'button',class:'sw2',role:'switch','aria-checked':on?'true':'false','aria-label':label});
    b.addEventListener('click',function(){fn(b);});
    return b;
  }
  sh.append(h('h3',null,bi('⚙️ Settings','Ajustes')),
    h('div',{class:'row'},h('label',{for:'voiceSel'},bi('Voice','Voz')),vs),
    h('div',{class:'row'},h('label',{for:'rate'},bi('Speed','Velocidad')),h('span',{style:'display:flex;align-items:center;gap:8px'},rate,rv)),
    h('div',{class:'row'},h('label',{for:'qn'},bi('Questions per quiz','Preguntas por prueba')),qn),
    h('div',{class:'row'},h('label',null,bi('🇪🇸 Show Spanish translations','Mostrar traducciones en español')),sw('swEs','Show Spanish translations',CFG.es!==false,function(b){CFG.es=!(CFG.es!==false);saveCfg();applyEs();b.setAttribute('aria-checked',CFG.es?'true':'false');})),
    h('div',{class:'row'},h('label',null,bi('🎙️ Microphone (stays on)','Micrófono (queda abierto)')),SR?sw('swMic','Microphone',Mic.wanted,async function(b){
      if(Mic.wanted){Mic.disable();toast(I('Microphone turned off.','Micrófono apagado.'));}
      else{try{await Mic.enable();toast(I('Microphone is on.','Micrófono activo.'));}catch(e){toast(micMsg(e));}}
      b.setAttribute('aria-checked',Mic.wanted?'true':'false');
    }):h('small',null,'Not available')),
    h('div',{class:'row'},h('label',null,bi('🔔 Sounds & vibration','Sonidos y vibración')),sw('swSound','Sounds',CFG.sound!==false,function(b){CFG.sound=!(CFG.sound!==false);saveCfg();b.setAttribute('aria-checked',CFG.sound?'true':'false');if(CFG.sound)sfx('ok');})),
    h('div',{class:'row'},h('label',null,bi('🌙 Dark mode','Modo oscuro')),sw('swDark','Dark mode',document.documentElement.getAttribute('data-theme')==='dark',function(b){
      CFG.theme=(document.documentElement.getAttribute('data-theme')==='dark')?'light':'dark';applyTheme();saveCfg();b.setAttribute('aria-checked',CFG.theme==='dark'?'true':'false');
    })),
    h('div',{class:'center',style:'margin-top:14px'},
      h('button',{class:'btn',type:'button',id:'testVoice',onclick:function(){playAudio({text:'Hello! This is your English voice. Let us practice.'});}},bi('🔊 Test voice','Probar voz')),
      h('button',{class:'btn',type:'button',onclick:function(){closeSheet();stopAll();go('login');}},bi('⇄ Switch profile','Cambiar de perfil')),
      h('button',{class:'btn pri',type:'button',id:'closeSheet',onclick:closeSheet},bi('Done','Listo'))));
  ov.append(sh);host.append(ov);
}

document.addEventListener('click',function(e){
  var t=e.target.closest&&e.target.closest('[data-say]');

});
$('#gearBtn').addEventListener('click',openSettings);

$('#micChip').addEventListener('click',async function(){

  catch(e){toast(micMsg(e));}
});
if(TTS){loadVoices();if(speechSynthesis.onvoiceschanged!==undefined)speechSynthesis.onvoiceschanged=function(){loadVoices();};}
Mic.chip();
window.addEventListener('beforeunload',function(){try{Mic.disable();}catch(e){}});

   ============================================================ */
applyTheme();applyEs();renderStats();
(function boot(){
  var ok=CFG.lastUser&&profileOf(CFG.lastUser);
  if(ok)setUser(CFG.lastUser);
  go(ok?'home':'login');
  if(cloudOn())cloudPull().then(function(n){if(n&&cur==='home')go('home');});
})();
window.__EP={QZ:QZ,checkType:checkType,scoreSpeech:scoreSpeech,normText:normText,numWords:numWords,COUNTRIES:COUNTRIES,SECTIONS:SECTIONS,EXAM_POOL:EXAM_POOL,
  DB:DB,CFG:CFG,Mic:Mic,PROFILES:PROFILES,BADGES:BADGES,FLAGS:FLAGS,setUser:setUser,go:go,startQuiz:startQuiz,mergeUsers:mergeUsers,mixedGen:mixedGen,lightGen:lightGen,teamCSV:teamCSV,
  getS:function(){return S;},getUser:function(){return USER;},alertsList:alertsList,classStats:classStats,dayStreak:dayStreak};
})();
</script>
